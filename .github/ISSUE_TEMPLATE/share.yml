name: Share a skill or workflow
description: Share a prompt, skill or workflow you use. No benchmark score, git or code needed.
title: "Share: "
labels: [community-share]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for sharing! Fill in what you can; a maintainer will turn this into an entry in [`community/`](https://github.com/BuddhistAI/buddhist-skills/tree/main/community) and credit you. Only share material you are free to share (see the [code of conduct](https://github.com/BuddhistAI/buddhist-skills/blob/main/CODE_OF_CONDUCT.md)).
  - type: input
    id: title
    attributes:
      label: Name
      description: A short name people will recognise.
      placeholder: Glossary-first Pali translation prompt
    validations: {required: true}
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options: [Prompt, Skill (SKILL.md), Workflow (several steps)]
    validations: {required: true}
  - type: input
    id: language
    attributes:
      label: Language of the source text
      description: One language per entry. Add the target language for translation.
      placeholder: Pali → English
    validations: {required: true}
  - type: textarea
    id: what
    attributes:
      label: What it does and who it is for
    validations: {required: true}
  - type: textarea
    id: content
    attributes:
      label: The prompt, skill or steps
      description: Paste it here, or link to where it lives.
      render: markdown
    validations: {required: true}
  - type: textarea
    id: example
    attributes:
      label: A short example
      description: A real input and the output it gave.
  - type: textarea
    id: limits
    attributes:
      label: Models used and known limits
      placeholder: Used with Claude Sonnet and GPT; sometimes drops verse numbers.
  - type: input
    id: credit
    attributes:
      label: How should we credit you?
      placeholder: Your Name (Your Organization)
    validations: {required: true}
  - type: checkboxes
    id: license
    attributes:
      label: License
      options:
        - label: I am free to share this, and agree to release it under the MIT license.
          required: true
